# Builds and publishes CANARY releases only (the dsc and Simien model).
# tag-canary.yml names the build and dispatches this against its tag. It never
# creates a stable vX.Y.Z tag or touches latest.json: that is promote.yml.
#
# R2 layout (mirab-releases, served at https://mirab-releases.addis.gg); directories
# are the release's full version with no "v":
#   <version>/mirab-<platform>.tar.gz   mirab for one platform (scripts/package.sh)
#   <version>/release.json              version, commit, channel, sha256 per platform
#   <version>/vm/manifest.json          the guest images (src/isolation/image.ts)
#   <version>/vm/<platform>/<file>.gz   kernel, rootfs, vz helper per VM platform
#   canary.json                         the newest canary's release.json
#   latest.json                         the newest stable's (promote.yml)
#   install.sh                          the installer, from this repo
name: Release (canary)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*-canary-*'

permissions:
  contents: read

env:
  R2_BUCKET_RELEASES: mirab-releases
  BUN_VERSION: 1.4.3

jobs:
  resolve:
    name: Resolve the canary
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The ref is a canary of this commit and this version
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is a stable tag. Stable releases come from promote.yml."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-([0-9a-f]{7})$ ]]; then
            echo "::error::${TAG} is not a canary ref. Expected vX.Y.Z-canary-<7-char sha>."
            exit 1
          fi
          BASE_VERSION="${BASH_REMATCH[1]}"
          SHA7="${BASH_REMATCH[2]}"
          TREE_VERSION="$(scripts/version.sh)"
          if [ "$BASE_VERSION" != "$TREE_VERSION" ]; then
            echo "::error::${TAG} names ${BASE_VERSION} but package.json at this commit is ${TREE_VERSION}."
            exit 1
          fi
          if [ "$SHA7" != "$(git rev-parse --short=7 HEAD)" ]; then
            echo "::error::${TAG} names commit ${SHA7} but this ref is $(git rev-parse --short=7 HEAD)."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "base_version=${BASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

  images:
    # Every guest image from the one recipe (guest-agent/rootfs.Dockerfile),
    # each architecture on its own Linux runner: x64 gives linux-x64 and
    # darwin-x64, arm64 gives darwin-arm64.
    name: Guest images (${{ matrix.arch }})
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun scripts/vm-release.ts build ${{ matrix.arch }} out
      - name: Compress
        run: |
          set -euo pipefail
          rm -rf out/.guest
          for f in out/*/*; do gzip -n -6 "$f"; done
          ls -la out/*/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vm-${{ matrix.arch }}
          path: out/
          retention-days: 1

  vz:
    # The vz helper for each Mac, signed ad hoc with its entitlement.
    name: vz helper (${{ matrix.platform }})
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/build-vz-helper.sh "out/${{ matrix.platform }}/mirab-vz"
      - run: gzip -n -9 "out/${{ matrix.platform }}/mirab-vz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vz-${{ matrix.platform }}
          path: out/
          retention-days: 1

  package:
    name: Package (${{ matrix.platform }})
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, darwin-x64, darwin-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: scripts/package.sh ${{ matrix.platform }} "${{ needs.resolve.outputs.version }}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirab-${{ matrix.platform }}
          path: dist/mirab-${{ matrix.platform }}.tar.gz
          retention-days: 1

  smoke:
    # What a customer runs, on each platform's own machine, with nothing but
    # the tarball: no checkout, no Bun on PATH.
    name: Smoke (${{ matrix.platform }})
    needs: [resolve, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mirab-${{ matrix.platform }}
          path: dist
      - name: It runs, says its version, and makes an agent
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/bin"
          tar -xzf "dist/mirab-${{ matrix.platform }}.tar.gz" -C "$home"
          ln -s "../mirab-${{ matrix.platform }}/bin/mirab" "$home/bin/mirab"
          run() { env -i HOME="$home" PATH=/usr/bin:/bin "$home/bin/mirab" "$@"; }
          VERSION="$(run --version)"
          if [ "$VERSION" != "${{ needs.resolve.outputs.base_version }}" ]; then
            echo "::error::mirab --version says ${VERSION}, expected ${{ needs.resolve.outputs.base_version }}"
            exit 1
          fi
          run init "$home/agent" --name gg.addis.agent.smoke --no-git
          test -f "$home/agent/agent/agent.ts"
          run vm status
          grep -q '"version": "${{ needs.resolve.outputs.version }}"' "$home/mirab-${{ matrix.platform }}/lib/release.json"
          echo "mirab ${VERSION} runs on ${{ matrix.platform }}"

  publish:
    name: Publish to R2
    needs: [resolve, images, vz, smoke]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: write # dispatches publish.yml (npm) once the release is on R2
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Lay out the release and its manifests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BASE_VERSION: ${{ needs.resolve.outputs.base_version }}
        run: |
          set -euo pipefail
          out="release/${VERSION}"
          mkdir -p "$out/vm"
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            cp "artifacts/mirab-${platform}/mirab-${platform}.tar.gz" "$out/"
          done
          for a in artifacts/vm-x64 artifacts/vm-arm64 artifacts/vz-darwin-x64 artifacts/vz-darwin-arm64; do
            cp -R "$a"/. "$out/vm/"
          done
          bun scripts/vm-release.ts manifest "$out/vm" "$VERSION" > /dev/null
          python3 - "$out" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          out = sys.argv[1]
          def sha(name):
              return hashlib.sha256(open(os.path.join(out, name), "rb").read()).hexdigest()
          manifest = {
              "name": "mirab",
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "commit": os.environ["GITHUB_SHA"],
              "channel": "canary",
              "base_version": os.environ["BASE_VERSION"],
              "promoted_from": None,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "binaries": {
                  p: {"name": f"mirab-{p}.tar.gz", "sha256": sha(f"mirab-{p}.tar.gz")}
                  for p in ("linux-x64", "darwin-x64", "darwin-arm64")
              },
          }
          with open(os.path.join(out, "release.json"), "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat "$out/release.json" "$out/vm/manifest.json"
      - name: Release keys are present
        run: |
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::publishing needs R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi
      - name: Upload the versioned release
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          aws s3 sync "release/${VERSION}/" "s3://${R2_BUCKET_RELEASES}/${VERSION}/" --endpoint-url="${R2_ENDPOINT}"
      - name: Publish the installer
        run: |
          aws s3 cp install.sh "s3://${R2_BUCKET_RELEASES}/install.sh" --endpoint-url="${R2_ENDPOINT}" \
            --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
      - name: Read it back from mirab-releases.addis.gg
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          base="https://mirab-releases.addis.gg/${VERSION}"
          curl -fsSL "$base/release.json" -o served.json
          cmp served.json "release/${VERSION}/release.json"
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            want="$(python3 -c "import json; print(json.load(open('served.json'))['binaries']['${platform}']['sha256'])")"
            got="$(curl -fsSL "$base/mirab-${platform}.tar.gz" | sha256sum | cut -d' ' -f1)"
            [ "$want" = "$got" ] || { echo "::error::mirab-${platform}.tar.gz served from R2 does not match its sha256"; exit 1; }
          done
          # Every guest image file too, against vm/manifest.json.
          curl -fsSL "$base/vm/manifest.json" -o vm.json
          cmp vm.json "release/${VERSION}/vm/manifest.json"
          # curl, like a customer's installer and mirab itself (Cloudflare turns
          # away Python's default user agent).
          python3 -c "import json; m=json.load(open('vm.json')); [print(e['file'], e['sha256']) for r in m['platforms'].values() for e in r.values()]" |
            while read -r file want; do
              got="$(curl -fsSL "$base/vm/$file" | sha256sum | cut -d' ' -f1)"
              [ "$want" = "$got" ] || { echo "::error::vm/$file served from R2 does not match vm/manifest.json"; exit 1; }
            done
          echo "every guest image file matches vm/manifest.json"
      - name: Point canary.json at it
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          aws s3 cp "release/${VERSION}/release.json" "s3://${R2_BUCKET_RELEASES}/canary.json" \
            --endpoint-url="${R2_ENDPOINT}" --cache-control "no-cache"
      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG="${{ needs.resolve.outputs.tag }}"
          files="release/${VERSION}/release.json release/${VERSION}/mirab-*.tar.gz"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" $files --repo "${{ github.repository }}" \
              --title "mirab ${VERSION} (canary)" --prerelease \
              --notes "Canary build of ${GITHUB_SHA}. Install it: curl -fsSL https://mirab-releases.addis.gg/install.sh | sh -s -- --canary"
          fi
      # The npm library follows the release: same version, dist-tag canary.
      # publish.yml checks the release is on R2 and built from this tag.
      - name: Publish the library to npm (canary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "${{ github.repository }}" --ref main \
            -f version="${{ needs.resolve.outputs.version }}" \
            -f ref="${{ needs.resolve.outputs.tag }}" \
            -f dist_tag=canary
      - name: Summary
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          {
            echo "### mirab ${VERSION} (canary)"
            echo "- https://mirab-releases.addis.gg/${VERSION}/release.json"
            echo "- canary.json now points here; latest.json was not touched (promote.yml)"
            echo "- npm: mirab@${VERSION} on dist-tag canary (publish.yml, dispatched)"
          } >> "$GITHUB_STEP_SUMMARY"
