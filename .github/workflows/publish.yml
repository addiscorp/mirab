# Publishes the mirab library to npm, following the releases on
# mirab-releases: the npm version is always the name of a release there, so
# the library finds its own VM image by its version.
#
#   canary  release.yml, after it publishes vX.Y.Z-canary-<sha> to R2, runs
#           this with that version and dist-tag `canary`.
#   stable  promote.yml, after it copies the canary to X.Y.Z, runs this with
#           X.Y.Z and dist-tag `latest`, from the promoted canary's commit.
#
# Run by hand only to retry one of those. It refuses a version that has no
# release on mirab-releases, or whose release names another commit. The
# mirab CLI ships as a binary from mirab-releases, never npm (no `bin`).
#
# npm trusted publishing (OIDC): npm trusts this workflow by its filename
# (`publish.yml`) in the `release` environment. There is no NPM_TOKEN anywhere.
# Renaming this file breaks that trust.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A release on mirab-releases: X.Y.Z-canary-<sha> or X.Y.Z'
        required: true
        type: string
      ref:
        description: "The git tag it was built from (the canary's tag, also for a promotion)"
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options: [canary, latest]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing, no NPM_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: The version is a release on mirab-releases, built from this commit
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          case "$DIST_TAG:$VERSION" in
            canary:*-canary-*|latest:[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$VERSION doesn't belong on dist-tag $DIST_TAG" >&2; exit 1 ;;
          esac
          case "$VERSION" in *-canary-*) ;; *) [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not X.Y.Z" >&2; exit 1; } ;; esac
          curl -fsS "https://mirab-releases.addis.gg/${VERSION}/vm/manifest.json" -o /dev/null \
            || { echo "::error::mirab-releases has no VM image for ${VERSION}" >&2; exit 1; }
          commit="$(curl -fsS "https://mirab-releases.addis.gg/${VERSION}/release.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).commit))')"
          [ "$commit" = "$(git rev-parse HEAD)" ] \
            || { echo "::error::release ${VERSION} names ${commit}, but ${{ inputs.ref }} is $(git rev-parse HEAD)" >&2; exit 1; }
          base="$(node -p "require('./package.json').version")"
          [ "${VERSION%%-canary-*}" = "$base" ] \
            || { echo "::error::${VERSION} isn't a build of package.json's ${base}" >&2; exit 1; }
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@12 && npm --version
      - name: Publish (or, if this version is already on npm, move the dist-tag to it)
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ "$(npm view "mirab@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
            if [ "$(npm view "mirab@${DIST_TAG}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "mirab@${VERSION} is already on npm as ${DIST_TAG}; nothing to do"
            else
              npm dist-tag add "mirab@${VERSION}" "$DIST_TAG"
            fi
          else
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm publish --access public --tag "$DIST_TAG"
          fi
      # Read back. npm may take a few minutes to show a new version.
      - name: Verify
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 30); do
            if [ "$(npm view "mirab@${DIST_TAG}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "mirab@${DIST_TAG} is ${VERSION}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::mirab@${DIST_TAG} never became ${VERSION}" >&2
          exit 1
