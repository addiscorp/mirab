# A pull request that changes what mirab ships (src/, guest-agent/, scripts/,
# vz/, install.sh, types/) adds its entry under the current version in
# CHANGELOG.md (scripts/changelog.ts check). The `no-changelog` label skips
# this job, for CI-only or docs-only changes.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry:
    name: CHANGELOG.md entry
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun scripts/changelog.ts check "origin/${{ github.base_ref }}"
