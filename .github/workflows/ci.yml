name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ vars.HOST_RUNNERS == 'true' && 'host-linux-x64' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # The safe-alias test drives a real zsh alias.
      - if: runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run format:check
      # Packages that depend on mirab (woreda) check against these declarations,
      # not mirab's source; they must match it.
      - name: Type declarations are current (bun run types)
        run: |
          bun run types
          git diff --exit-code -- types || { echo 'run: bun run types, and commit types/' >&2; exit 1; }
          test -z "$(git status --porcelain -- types)" || { git status --short -- types; echo 'run: bun run types, and commit types/' >&2; exit 1; }
      # mirab is forge-neutral: forge words live in the adapters (woreda), never here.
      - name: No forge words in mirab
        run: |
          if grep -rnE 'jitconfig|ACTIONS_RUNNER' src --include='*.ts' --exclude='*.test.ts'; then
            echo 'forge-specific code belongs in a forge adapter (woreda), not mirab' >&2
            exit 1
          fi
      - run: bun test --timeout 30000

  macos:
    # Descriptor-anchored sync and special files behave differently on each Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ vars.HOST_RUNNERS == 'true' && (matrix.os == 'macos-15' && 'host-macos-arm64' || 'host-macos-x64') || matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test src/isolation/anchored-fs.test.ts src/isolation/sync.test.ts --timeout 30000

  vm-linux:
    # The live VM tests under Firecracker, the way the Mac runs them under vz:
    # mirab's kernel and the one rootfs recipe, built from this checkout.
    runs-on: ${{ vars.HOST_RUNNERS == 'true' && 'host-linux-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: KVM for the runner's user
        # Host runners are in the kvm group already.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The trigger is asynchronous: wait for the rule to apply.
          sudo udevadm settle
          ls -l /dev/kvm
          test -w /dev/kvm
      - name: Firecracker, pinned (scripts/firecracker.json)
        run: |
          set -euo pipefail
          field() { bun -e "console.log((await Bun.file('scripts/firecracker.json').json())$1)"; }
          version=$(field .version)
          curl -fsSL -o "$RUNNER_TEMP/fc.tgz" "$(field .tarball)"
          echo "$(field .sha256)  $RUNNER_TEMP/fc.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/fc.tgz" -C "$RUNNER_TEMP" "release-v$version-x86_64/firecracker-v$version-x86_64"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/release-v$version-x86_64/firecracker-v$version-x86_64" "$RUNNER_TEMP/bin/firecracker"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The guest, from this checkout
        run: bun run vm:image --config-dir "$RUNNER_TEMP/mirab"
      # The filtered-network test needs the tap setup (sudo) and skips here.
      - name: The live VM tests, under Firecracker
        env:
          TEST_VM_CONFIG_DIR: ${{ runner.temp }}/mirab
        run: |
          set -euo pipefail
          mkdir -p .tmp
          export TMPDIR="$PWD/.tmp"
          bun test $(git ls-files 'src/*.e2e.test.ts') --timeout 300000

  vz-helper:
    # The macOS `vm` backend's launcher must compile and carry its entitlement.
    runs-on: ${{ vars.HOST_RUNNERS == 'true' && 'host-macos-arm64' || 'macos-15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/build-vz-helper.sh
      # The guest agent macOS guests run (released next to the helper).
      - run: cargo test --locked --manifest-path guest-agent/Cargo.toml
