# Promote a published canary to stable (the dsc model): the same bytes, no
# rebuild. Run by a person: Actions → Promote → Run workflow, with the canary
# tag (vX.Y.Z-canary-<sha>).
#
# Checks the canary's release.json names the tagged commit, copies
# <canary>/ to <X.Y.Z>/ in mirab-releases (guest images in vm/ included),
# rewrites that release.json and vm/manifest.json for the stable channel,
# reads every file back, points latest.json at it, tags vX.Y.Z on the canary's commit
# and makes the GitHub release. A version is promoted once; the next needs a
# bump (scripts/bump-version.sh).
name: Promote

on:
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary tag to promote (e.g. v0.61.0-canary-a1b2c3d)"
        required: true
        type: string

permissions:
  contents: write
  actions: write # dispatches publish.yml (npm) once the stable release is on R2

env:
  R2_BUCKET_RELEASES: mirab-releases
  BUN_VERSION: 1.4.3

jobs:
  promote:
    name: Promote canary to stable
    runs-on: ${{ vars.HOST_RUNNERS == 'true' && 'host-linux-x64' || 'ubuntu-24.04' }}
    environment: release
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Release keys are present
        run: |
          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::promote needs R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in the release environment."
            exit 1
          fi
      - name: The input is an unpromoted canary of this repository
        id: validate
        env:
          CANARY: ${{ inputs.canary }}
        run: |
          set -euo pipefail
          if [[ ! "$CANARY" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-[0-9a-f]{7}$ ]]; then
            echo "::error::'${CANARY}' is not a canary tag. Expected vX.Y.Z-canary-<7-char sha>."
            exit 1
          fi
          V="${BASH_REMATCH[1]}"
          git rev-parse "$CANARY" >/dev/null 2>&1 || { echo "::error::canary tag ${CANARY} does not exist."; exit 1; }
          if git rev-parse "v${V}" >/dev/null 2>&1; then
            echo "::error::v${V} already exists. A version is promoted once; bump it for the next release."
            exit 1
          fi
          {
            echo "canary=${CANARY}"
            echo "canary_dir=${CANARY#v}"
            echo "v=${V}"
            echo "commit=$(git rev-parse "${CANARY}^{}")"
          } >> "$GITHUB_OUTPUT"
      - name: The canary's artifacts are this commit's
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET_RELEASES}/${{ steps.validate.outputs.canary_dir }}/release.json" canary.json \
            --endpoint-url="${R2_ENDPOINT}"
          RECORDED="$(python3 -c 'import json; print(json.load(open("canary.json"))["commit"])')"
          if [ "$RECORDED" != "${{ steps.validate.outputs.commit }}" ]; then
            echo "::error::${{ steps.validate.outputs.canary }}/release.json records ${RECORDED}, but the tag points at ${{ steps.validate.outputs.commit }}."
            exit 1
          fi
      - name: Copy the same bytes to the stable path, with a stable manifest
        run: |
          set -euo pipefail
          V="${{ steps.validate.outputs.v }}"
          mkdir -p "stable/${V}"
          # Everything, guest images (vm/) included. The canary's directory
          # keeps its own copy, where the shipped mirab (stamped with that
          # release) looks; X.Y.Z/vm/ is what the npm library at X.Y.Z and
          # anyone following latest.json fetch.
          aws s3 cp --recursive "s3://${R2_BUCKET_RELEASES}/${{ steps.validate.outputs.canary_dir }}/" "stable/${V}/" \
            --endpoint-url="${R2_ENDPOINT}"
          # The same image bytes, checked against the canary's manifest, which
          # then names X.Y.Z (src/isolation/image.ts refuses another version's).
          bun scripts/vm-release.ts promote "stable/${V}/vm" "$V"
          python3 - "stable/${V}/release.json" "$V" "${{ steps.validate.outputs.canary }}" <<'PY'
          import hashlib, json, os, sys
          path, v, canary = sys.argv[1:4]
          data = json.load(open(path))
          # The bytes must be the ones the canary recorded.
          for platform, entry in data["binaries"].items():
              got = hashlib.sha256(open(os.path.join(os.path.dirname(path), entry["name"]), "rb").read()).hexdigest()
              assert got == entry["sha256"], f"{entry['name']} does not match the canary's sha256"
          data.update(version=v, tag=f"v{v}", channel="stable", promoted_from=canary)
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          aws s3 sync "stable/${V}/" "s3://${R2_BUCKET_RELEASES}/${V}/" --endpoint-url="${R2_ENDPOINT}"
      - name: Read it back from mirab-releases.addis.gg
        run: |
          set -euo pipefail
          V="${{ steps.validate.outputs.v }}"
          base="https://mirab-releases.addis.gg/${V}"
          curl -fsSL "$base/release.json" -o served.json
          cmp served.json "stable/${V}/release.json"
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            want="$(python3 -c "import json; print(json.load(open('served.json'))['binaries']['${platform}']['sha256'])")"
            got="$(curl -fsSL "$base/mirab-${platform}.tar.gz" | sha256sum | cut -d' ' -f1)"
            [ "$want" = "$got" ] || { echo "::error::mirab-${platform}.tar.gz served from R2 does not match its sha256"; exit 1; }
          done
          curl -fsSL "$base/vm/manifest.json" -o vm.json
          cmp vm.json "stable/${V}/vm/manifest.json"
          python3 -c "import json; m=json.load(open('vm.json')); [print(e['file'], e['sha256']) for r in m['platforms'].values() for e in r.values()]" |
            while read -r file want; do
              got="$(curl -fsSL "$base/vm/$file" | sha256sum | cut -d' ' -f1)"
              [ "$want" = "$got" ] || { echo "::error::vm/$file served from R2 does not match vm/manifest.json"; exit 1; }
            done
          echo "${V}: every binary and guest image file matches its manifest"
      - name: Point latest.json at it
        run: |
          V="${{ steps.validate.outputs.v }}"
          aws s3 cp "stable/${V}/release.json" "s3://${R2_BUCKET_RELEASES}/latest.json" \
            --endpoint-url="${R2_ENDPOINT}" --cache-control "no-cache"
      - name: Tag vX.Y.Z and make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.validate.outputs.v }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${V}" "${{ steps.validate.outputs.commit }}" -m "mirab ${V} (promoted from ${{ steps.validate.outputs.canary }})"
          git push origin "v${V}"
          gh release create "v${V}" stable/${V}/release.json stable/${V}/mirab-*.tar.gz --repo "${{ github.repository }}" --title "mirab ${V}" \
            --notes "Promoted from ${{ steps.validate.outputs.canary }}, the same bytes. Install: curl -fsSL https://mirab-releases.addis.gg/install.sh | sh"
      # The npm library follows: X.Y.Z on dist-tag latest, built from the
      # promoted canary's commit (publish.yml checks both against R2).
      - name: Publish the library to npm (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "${{ github.repository }}" --ref main \
            -f version="${{ steps.validate.outputs.v }}" \
            -f ref="${{ steps.validate.outputs.canary }}" \
            -f dist_tag=latest
      - name: Summary
        run: |
          V="${{ steps.validate.outputs.v }}"
          {
            echo "### mirab ${V} is stable"
            echo "- https://mirab-releases.addis.gg/${V}/release.json (from ${{ steps.validate.outputs.canary }})"
            echo "- https://mirab-releases.addis.gg/${V}/vm/manifest.json (the canary's guest images, read back)"
            echo "- latest.json points here"
            echo "- npm: mirab@${V} on dist-tag latest (publish.yml, dispatched)"
          } >> "$GITHUB_STEP_SUMMARY"
