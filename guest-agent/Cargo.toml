[package]
name = "mirab-guest-agent"
version = "0.2.1"
edition = "2021"
description = "Guest side of mirab isolation: runs steps inside a microVM or container and streams their output"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
